{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>RobWeb AI</title>

    <script type="module"
            src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
    </script>

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap"
          rel="stylesheet">

</head>

<body>


<!-- ========================= -->
<!-- BACKGROUND FX -->
<!-- ========================= -->

<div class="background-grid"></div>

<div class="global-overlay"></div>


<!-- ========================= -->
<!-- HEADER / BANNER -->
<!-- ========================= -->

<header class="banner" id="banner">

    <img src="{% static 'Banner.jpg' %}"
         alt="Banner Principal">

    <div class="banner-shadow"></div>

</header>


<!-- ========================= -->
<!-- LOGO -->
<!-- ========================= -->

<div class="logo-container">

    <img src="{% static 'Logo.png' %}"
         class="logo"
         alt="RobWeb Logo">

</div>



<!-- ========================= -->
<!-- MAIN CONTENT -->
<!-- ========================= -->

<main class="main-content">



    <!-- ========================= -->
    <!-- HERO VIDEO NOTICIAS -->
    <!-- ========================= -->

    <section class="hero-news-container">


        <div class="hero-overlay">

            <div class="scan-line"></div>

            <div class="noise-overlay"></div>

            <div class="hero-hud top-left">
                MERCADOLIBRE ONLINE
            </div>

            <div class="hero-hud top-right">
                DGI CONNECTED
            </div>

            <div class="hero-hud bottom-left">
                RPA ACTIVE
            </div>

            <div class="hero-hud bottom-right">
                LIVE TRANSMISSION
            </div>

        </div>


        <video class="hero-video"
               autoplay
               muted
               loop
               playsinline
               preload="metadata">

            <source src="{% static 'noticias.mp4' %}"
                    type="video/mp4">

        </video>


        <div class="live-indicator">

            <span class="live-dot"></span>

            EN VIVO

        </div>


    </section>





    <!-- ========================= -->
    <!-- VIDEO RPA -->
    <!-- ========================= -->

    <section class="rpa-section glass-container">


        <div class="section-header">

            <h2>
                FACTURACIÓN AUTOMÁTICA IA
            </h2>

            <span>
                SISTEMA OPERATIVO EN TIEMPO REAL
            </span>

        </div>


        <div class="video-wrapper">


            <div class="video-overlay">

                <div class="scan-line"></div>

                <div class="noise-overlay"></div>

                <div class="micro-data top-left">
                    ESCANEANDO ÓRDENES...
                </div>

                <div class="micro-data top-right">
                    VALIDANDO DATOS
                </div>

                <div class="micro-data bottom-left">
                    PDF GENERATED
                </div>

                <div class="micro-data bottom-right">
                    FACTURA ADJUNTADA
                </div>

            </div>


            <video class="rpa-video"
                   autoplay
                   muted
                   loop
                   playsinline
                   preload="metadata">

                <source src="{% static 'models/video.mp4' %}"
                        type="video/mp4">

            </video>


        </div>


    </section>





    <!-- ========================= -->
    <!-- ROBOT 3D -->
    <!-- ========================= -->

    <section class="robot-section glass-container">


        <div class="robot-overlay">

            <div class="scan-line"></div>

            <div class="robot-glow"></div>

        </div>


        <div class="robot-header">

            <h2>
                IA OPERATIVA
            </h2>

            <span>
                MOTOR DE AUTOMATIZACIÓN RPA
            </span>

        </div>


        <model-viewer

            src="{% static 'models/robot.glb' %}"
            alt="Robot IA"

            auto-rotate
            auto-rotate-delay="0"

            camera-controls

            shadow-intensity="1"

            environment-image="neutral"

            exposure="1"

            loading="lazy"

            interaction-prompt="none">

        </model-viewer>


        <div class="robot-status">

            <span class="status-dot"></span>

            SISTEMA ESTABLE

        </div>


    </section>





    <!-- ========================= -->
    <!-- TESLA BUTTON -->
    <!-- ========================= -->

    <section class="button-section">


        <button class="tesla-button">


            <div class="button-glow"></div>


            <img src="{% static 'Logo2.png' %}"
                 alt="Logo Tesla">


        </button>


    </section>


</main>





<!-- ========================= -->
<!-- SCROLL EFFECT -->
<!-- ========================= -->

<script>

    const banner = document.getElementById("banner");

    window.addEventListener("scroll", () => {

        if (window.scrollY > 40) {

            banner.classList.add("banner-small");

        } else {

            banner.classList.remove("banner-small");

        }

    });

</script>


</body>
</html>
