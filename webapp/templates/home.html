{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>SysRob | Facturación Automática IA</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- MODEL VIEWER -->
    <script type="module"
            src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
    </script>

</head>

<body>

    <!-- FX -->
    <div class="background-glow"></div>
    <div class="scanlines"></div>

    <!-- HEADER -->
    <header class="top-banner">

        <img src="{% static 'Banner.jpg' %}"
             alt="Banner"
             class="banner-image">

        <div class="live-indicator">

            <span class="live-dot"></span>
            <span>EN VIVO</span>

        </div>

    </header>

    <!-- MAIN -->
    <main class="main-wrapper">

        <!-- NOTICIAS -->
        <section class="news-section glass-panel">

            <div class="section-header">

                <span class="section-mini">
                    EN VIVO
                </span>

                <h1>
                    FACTURACIÓN AUTOMÁTICA IA
                </h1>

                <p>
                    SISTEMA OPERATIVO EN TIEMPO REAL
                </p>

            </div>

            <div class="news-video-wrapper">

                <video class="news-video"
                       autoplay
                       muted
                       loop
                       playsinline
                       preload="metadata">

                    <source src="{% static 'noticias.mp4' %}"
                            type="video/mp4">

                </video>

                <div class="video-overlay"></div>
                <div class="video-scan"></div>

                <div class="hud-left">
                    RPA ACTIVE
                </div>

                <div class="hud-right">
                    LIVE TRANSMISSION
                </div>

            </div>

        </section>

        <!-- VIDEO -->
        <section class="rpa-section glass-panel">

            <div class="section-header">

                <h2>
                    FACTURACIÓN AUTOMÁTICA IA
                </h2>

                <p>
                    MOTOR OPERATIVO EN TIEMPO REAL
                </p>

            </div>

            <div class="rpa-video-container">

                <video class="rpa-video"
                       autoplay
                       muted
                       loop
                       playsinline
                       preload="metadata">

                    <source src="{% static 'models/video.mp4' %}"
                            type="video/mp4">

                </video>

                <div class="video-overlay"></div>
                <div class="video-scan"></div>

                <div class="system-status">

                    <span class="status-dot"></span>

                    SISTEMA ONLINE

                </div>

            </div>

        </section>

        <!-- ROBOT 3D -->
        <section class="robot-section glass-panel">

            <div class="section-header">

                <h2>
                    IA OPERATIVA
                </h2>

                <p>
                    MOTOR DE AUTOMATIZACIÓN RPA
                </p>

            </div>

            <div class="robot-container">

                <model-viewer
                    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
                    alt="Astronaut"
                    auto-rotate
                    camera-controls
                    shadow-intensity="1"
                    exposure="1"
                    environment-image="neutral"
                    loading="lazy">

                </model-viewer>

                <div class="robot-glow"></div>

            </div>

        </section>

        <!-- BOTÓN TESLA -->
        <section class="tesla-button-section">

            <button class="tesla-button">

                <img src="{% static 'Logo2.png' %}"
                     alt="Logo Tesla"
                     class="tesla-logo">

            </button>

        </section>

    </main>

</body>
</html>
